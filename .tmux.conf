# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore on tmux start
set -g @continuum-restore 'on'

# Optional: Restore Neovim/Vim sessions
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Enable mouse mode (scrolling, clicking, resizing)
set -g mouse on

# Use Vim shortcuts for Copy Mode
setw -g mode-keys vi

# Fix escape time for Vim (makes switching modes faster)
set -s escape-time 0

