# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore on tmux start
set -g @continuum-restore 'on'

# Optional: Restore Neovim/Vim sessions
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Enable mouse mode (scrolling, clicking, resizing)
set -g mouse on

# Use Vim keybindings in copy mode
setw -g mode-keys vi

# Use 'v' to begin selection (like visual mode in Vim)
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Use 'y' to yank/copy the selection to the system clipboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Optional: Also copy to system clipboard if you just highlight with the mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Fix escape time for Vim (makes switching modes faster)
set -s escape-time 0

# vim: ft=tmux
