# i3 general controls
bindcode $mod+Shift+54 exec $noid "$config/i3/i3config.py && i3-msg reload"
bindcode $mod+Shift+27 exec $noid "$config/i3/i3config.py && i3-msg restart"
bindsym $mod+Shift+Escape bar mode hide, exec "i3-nagbar -t warning -m $msg-exit -B 'Yes, exit i3' 'i3-msg exit'"
bindcode $mod+53 exec cd $config/actions && cat "$(ls | $config/i3/scripts/menu -p Actions $bar-bgcolor $bar-fgcolor)" | sh
bindcode $mod+Shift+53 exec $config/i3/scripts/shiftx

# switch to workspace
bindcode $mod+10 workspace number $ws1
bindcode $mod+11 workspace number $ws2
bindcode $mod+12 workspace number $ws3
bindcode $mod+13 workspace number $ws4
bindcode $mod+14 workspace number $ws5
bindcode $mod+15 workspace number $ws6
bindcode $mod+16 workspace number $ws7
bindcode $mod+17 workspace number $ws8
bindcode $mod+18 workspace number $ws9
bindcode $mod+19 workspace number $ws10

# move focused container to workspace
bindcode $mod+Shift+10 move container to workspace number $ws1
bindcode $mod+Shift+11 move container to workspace number $ws2
bindcode $mod+Shift+12 move container to workspace number $ws3
bindcode $mod+Shift+13 move container to workspace number $ws4
bindcode $mod+Shift+14 move container to workspace number $ws5
bindcode $mod+Shift+15 move container to workspace number $ws6
bindcode $mod+Shift+16 move container to workspace number $ws7
bindcode $mod+Shift+17 move container to workspace number $ws8
bindcode $mod+Shift+18 move container to workspace number $ws9
bindcode $mod+Shift+19 move container to workspace number $ws10

# other workspace controls
bindcode $mod+52 workspace back_and_forth
bindcode $mod+Shift+52 move container to workspace back_and_forth
bindcode $mod+Shift+35 workspace next
bindcode $mod+Shift+34 workspace prev

# renaming and running commands
bindcode $mod+59 exec i3-input -P '(rename workspace) ' -F 'rename workspace to %s'
bindcode $mod+60 exec i3-input -P '(create workspace) ' -F 'workspace %s'
bindsym $mod+F2 exec i3-input -P '(rename window) ' -F 'exec set_title.sh "%s"'
bindcode $mod+61 exec i3-input -F '%s' -P "i3-msg /> "
bindcode $mod+Shift+61 exec $noid i3-input -F 'exec notify-send "%s" "$(%s 2>&1)"' -P "notify ?> "

# vim-like marks
bindcode $mod+58 exec i3-input -l 1 -F 'mark %s' -P '(mark) '
bindcode $mod+Shift+58 [con_id="__focused__"] unmark
bindcode $mod+48 exec i3-input -l 1 -F '[con_mark="%s"] focus' -P '(goto mark) '
bindcode $mod+Shift+48 exec i3-input -l 1 -F 'swap container with mark %s' -P '(swap with mark) '
bindcode $mod+24 [con_mark="q"] focus

# change container layout (stacked, tabbed, toggle split)
bindcode $mod+25 layout tabbed
bindcode $mod+26 layout toggle split
bindcode $mod+Shift+26 split toggle
bindcode $mod+39 layout stacking
bindcode $mod+Control+43 split h
bindcode $mod+Control+55 split v

# fullscreen, floating, and sticky
bindcode $mod+41 fullscreen toggle
bindcode $mod+Shift+41 floating toggle
bindcode $mod+Shift+28 sticky toggle

# scratchpad
bindcode $mod+20 scratchpad show
bindcode $mod+Shift+20 move scratchpad

# toggle bar visibility
bindcode $mod+Shift+56 bar mode toggle

# show window title
bindcode $mod+28 border normal
bindcode $mod+Shift+24 border pixel

# change focus
bindcode $mod+43 focus left
bindcode $mod+44 focus down
bindcode $mod+45 focus up
bindcode $mod+46 focus right
bindcode $mod+47 focus mode_toggle

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindcode $mod+33 focus parent
bindcode $mod+Shift+33 focus child

bindcode $mod+35 focus next
bindcode $mod+34 focus prev
bindsym $mod+Tab focus next
bindsym $mod+Shift+Tab focus prev

# move focused window
bindcode $mod+Shift+43 move left
bindcode $mod+Shift+44 move down
bindcode $mod+Shift+45 move up
bindcode $mod+Shift+46 move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# kill focused window
bindcode $mod+Shift+25 kill
bindsym $mod+Escape kill
bindcode $mod+55 exec i3-input -l 1 -F '[workspace="%s"] kill' -P '(kill workspace) '

# common applications
bindsym $mod+Return exec i3-sensible-terminal
bindsym $mod+Shift+Return exec i3-sensible-terminal -T "FloatShell"
bindcode $mod+40 exec $noid $config/i3/scripts/menu -c dmenu_run -p Run $bar-bgcolor $bar-fgcolor &> $home/.var/dmenu.log
bindcode $mod+Shift+40 exec $noid networkmanager_dmenu
bindcode $mod+54 exec j4-dmenu-desktop --dmenu="$config/i3/scripts/menu -p Run '$bar-bgcolor' '$bar-fgcolor'" &> $home/.var/dmenu.log

# launch custom Unicode grid picker
bindcode $mod+30 exec $noid rofi-unicode

# screenshot tools
bindsym Print exec prtsc screen
bindsym $mod+Print exec prtsc window
bindcode $mod+Shift+39 exec prtsc part

# toggle CopyQ clipboard manager
bindcode $mod+Shift+55 exec $noid "test $(copyq toggle) = false && i3 kill"

# pop up the most recent missed notification
bindcode $mod+57 exec $noid dunstctl history-pop
bindcode $mod+Shift+57 exec dunstctl set-paused toggle && pkill -RTMIN+11 i3blocks

# launch boomer (zoomit alternative)
bindcode $mod+49 exec $noid boomer

# launch peek (screen recorder)
bindcode $mod+$alt+27 exec peek

# resize mode
mode "resize" {
    # left/right shrink/grow width; up/down shrink/grow height
    bindcode 43 resize shrink width 10 px or 10 ppt
    bindcode 44 resize grow height 10 px or 10 ppt
    bindcode 45 resize shrink height 10 px or 10 ppt
    bindcode 46 resize grow width 10 px or 10 ppt

    # same bindings, but for the arrow keys
    bindsym Left resize shrink width 10 px or 10 ppt
    bindsym Down resize grow height 10 px or 10 ppt
    bindsym Up resize shrink height 10 px or 10 ppt
    bindsym Right resize grow width 10 px or 10 ppt

    bindcode 56 mode "border"

    # back to normal: Enter or Escape or $mod+r
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindcode $mod+27 mode "default"
}
bindcode $mod+27 mode "resize"

# border mode — manipulate borders of any window
mode "border" {
    # quick border settings
    bindcode 28 border normal
    bindcode 19 border none

    # adjusting border width
    bindcode 10 border pixel 1
    bindcode 11 border pixel 2
    bindcode 12 border pixel 3
    bindcode 13 border pixel 4
    bindcode 14 border pixel 5
    bindcode 15 border pixel 6
    bindcode 16 border pixel 7
    bindcode 17 border pixel 8
    bindcode 18 border pixel 9

    # controlling gaps
    bindcode 31 gaps inner current toggle 8
    bindcode 32 gaps outer current toggle 8

    # controlling status bar
    bindcode 24 bar mode dock
    bindcode 38 bar mode hide
    bindcode 52 bar mode invisible

    # control window title
    bindcode 25 title_window_icon toggle 8
    bindcode 53 title_format $title-bold-verbose
    bindcode 39 title_format $title-bold

    # center dialog
    bindcode 54 move position center

    bindcode 27 mode "resize"

    # exit to default mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindcode $mod+56 mode "default"
}
bindcode $mod+56 mode "border"

# gaming automation mode
mode "auto" {
    bindcode 33 exec "xdotool key --window '$(xdotool getactivewindow)' Pause"
    bindcode 24 exec xdotool key --delay 50 Pause Pause
    bindcode 31 exec $noid i3-input -F 'exec notify-send "%s" "$(xdotool key --delay %s 2>&1)"' -P "notify ?> "

    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindcode $mod+38 mode "default"
}
bindcode $mod+38 mode "auto"
