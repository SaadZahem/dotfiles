# Global settings
separator=true
separator_block_width=15
markup=pango
color=#999999

[arch-update]
LABEL=
command=scripts/arch-update-block -y
interval=once

[numlock]
label=🖩 
command=scripts/numlock-block
color=#ffaa00
interval=once
signal=15

[volume]
command=scripts/volume-block
color=#00bbff
interval=once
signal=10

[brightness]
label=🌣 
command=scripts/brightness-block
color=#ffff00
interval=once
signal=13

[memory]
label=☷ 
command=scripts/memory-block
interval=5

[cpu]
label= 
command=scripts/cpu-block
min_width=65
interval=5

# Root Storage (p3) - /
[root_storage]
label=🖴 /:
command=scripts/disk-block /
color=#A6E22E
interval=60

# Home Storage (p4) - /home
[home_storage]
label=🖴 /home:
command=scripts/disk-block /home
color=#66D9EF
interval=60

[battery]
BAT=/sys/class/power_supply/BAT0
command=scripts/battery-block
interval=20

[wireless]
INTERFACE=wlp1s0
LABEL= 
command=scripts/wifi-block
interval=6

[datetime]
command=date '+%Y-%m-%d %H:%M:%S'
interval=1

[pomodoro]
STATE_FILE=/tmp/pomodoro_state
command=scripts/pomodoro-block
interval=1

[notification]
label=🕭 
command=scripts/notifications-block
color=#66D9EF
interval=once
signal=11

[input]
command=scripts/input-block
color=#66D9EF
interval=once
signal=12

# vim: ft=toml
