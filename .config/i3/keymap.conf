# vim: ft=i3config

set $exit_msg 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.'

# i3 general controls
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m $exit_msg -B 'Yes, exit i3' 'i3-msg exit'"
bindsym $mod+Shift+Escape bar mode hide, exec "i3-nagbar -t warning -m $exit_msg -B 'Yes, exit i3' 'i3-msg exit'"

# workspace controls

# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

## Other workspace controls
bindsym $mod+z workspace back_and_forth
bindsym $mod+Shift+z move container to workspace back_and_forth
bindsym $mod+Shift+bracketright workspace next
bindsym $mod+Shift+bracketleft workspace prev

## Renaming and running commands
bindsym $mod+comma exec i3-input -P '(rename workspace) ' -F 'rename workspace to %s'
bindsym $mod+period exec i3-input -P '(create workspace) ' -F 'workspace %s'
bindsym $mod+F2 exec i3-input -P '(rename window) ' -F 'exec set_title.sh "%s"'

bindsym $mod+slash exec i3-input -F '%s' -P "i3-msg /> "
bindsym $mod+Shift+slash exec --no-startup-id i3-input -F 'exec notify-send "%s" "$(%s 2>&1)"' -P "notify ?> "

## vim-like marks
bindsym $mod+m exec i3-input -l 1 -F 'mark %s' -P '(mark) '
bindsym $mod+Shift+m [con_id="__focused__"] unmark
bindsym $mod+apostrophe exec i3-input -l 1 -F '[con_mark="%s"] focus' -P '(goto mark) '
bindsym $mod+Shift+apostrophe exec i3-input -l 1 -F 'swap container with mark %s' -P '(swap with mark) '

# layout controls

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+s layout stacking

bindsym $mod+Control+h split h
bindsym $mod+Control+v split v

## fullscreen, floating, and sticky
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+f floating toggle
bindsym $mod+Shift+t sticky toggle

## Working with scratchpad
bindsym $mod+minus scratchpad show
bindsym $mod+Shift+minus move scratchpad

## toggle bar visibility
bindsym $mod+Shift+b bar mode toggle

## show window title
bindsym $mod+t border normal

# window controls

# change focus
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+semicolon focus mode_toggle

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+p focus parent
bindsym $mod+Shift+p focus child

bindsym $mod+bracketright focus next
bindsym $mod+bracketleft focus prev

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# kill focused window
bindsym $mod+Shift+w kill
bindsym $mod+Escape kill

# Start applications

## common applications
bindsym $mod+Return exec i3-sensible-terminal
bindsym $mod+Shift+Return exec i3-sensible-terminal -T "FloatShell"
bindsym $mod+d exec --no-startup-id dmenu_run
bindsym $mod+x exec i3lock -c 000000
bindsym $mod+q [con_mark="q"] focus
bindsym $mod+Shift+q border pixel

## Screenshot tools: using flameshot and magick import, prtsc is my custom script that uses magick import located in ~/.local/bin/
bindsym Print exec prtsc screen
bindsym $mod+Print exec prtsc window
bindsym $mod+Shift+s exec --no-startup-id "sh -c 'flameshot gui -r | xclip -selection clipboard -t image/png'"

## Toggle CopyQ clipboard manager
bindsym $mod+Shift+v exec --no-startup-id copyq toggle

## Pop up the most recent missed notification
bindsym $mod+n exec --no-startup-id dunstctl history-pop
bindsym $mod+Shift+n exec dunstctl set-paused toggle && pkill -RTMIN+11 i3blocks

## Launch boomer (zoomit alternative)
bindsym $mod+grave exec --no-startup-id boomer

## Launch peek (screen recorder)
bindsym $mod+$alt+r exec peek

# Other modes

mode "resize" {
    # Pressing left will shrink the window’s width.
    # Pressing right will grow the window’s width.
    # Pressing up will shrink the window’s height.
    # Pressing down will grow the window’s height.
    bindsym h resize shrink width 10 px or 10 ppt
    bindsym j resize grow height 10 px or 10 ppt
    bindsym k resize shrink height 10 px or 10 ppt
    bindsym l resize grow width 10 px or 10 ppt

    # same bindings, but for the arrow keys
    bindsym Left resize shrink width 10 px or 10 ppt
    bindsym Down resize grow height 10 px or 10 ppt
    bindsym Up resize shrink height 10 px or 10 ppt
    bindsym Right resize grow width 10 px or 10 ppt

    # switch to other modes
    bindsym b mode "border"

    # back to normal: Enter or Escape or $mod+r
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}

bindsym $mod+r mode "resize"

## Manipulating borders of any window
mode "border" {
    # quick border settings
    bindsym t border normal
    bindsym 0 border none

    # adjusting border width
    bindsym 1 border pixel 1
    bindsym 2 border pixel 2
    bindsym 3 border pixel 3
    bindsym 4 border pixel 4
    bindsym 5 border pixel 5
    bindsym 6 border pixel 6
    bindsym 7 border pixel 7
    bindsym 8 border pixel 8
    bindsym 9 border pixel 9

    # controlling gaps
    bindsym i gaps inner current toggle 8
    bindsym o gaps outer current toggle 8

    # controlling status bar
    bindsym q bar mode dock
    bindsym a bar mode hide
    bindsym z bar mode invisible
    #bindsym b bar mode toggle, mode "default"

    # control window title
    bindsym w title_window_icon toggle 8
    bindsym x title_format $title_bold_verbose
    bindsym s title_format $title_bold

    # center dialog
    bindsym c move position center

    # switch to other modes
    bindsym r mode "resize"

    # exit to default mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+b mode "default"
}

bindsym $mod+b mode "border"

mode "auto" {
    bindsym p exec "xdotool key --window '$(xdotool getactivewindow)' Pause"
    bindsym q exec xdotool key --delay 50 Pause Pause
    bindsym i exec --no-startup-id i3-input -F 'exec notify-send "%s" "$(xdotool key --delay %s 2>&1)"' -P "notify ?> "

    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+a mode "default"
}

bindsym $mod+a mode "auto"
